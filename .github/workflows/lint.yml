name: Lint, Format & Auto-Heal

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-format-heal:
    name: Lint, Format & Auto-Heal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Auto-heal formatting and lint fixes
        run: |
          echo "Running auto-formatting and auto-fixes..."
          uv run ruff format .
          uv run ruff check --fix .

      - name: Commit and push auto-healed changes (if any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Auto-healed changes found. Committing and pushing..."
            git add -A
            git commit -m "chore(style): auto-heal linting and formatting [skip ci]"
            git push
          else
            echo "All files already cleanly formatted and linted."
          fi

      - name: Final lint verification (non-blocking)
        run: |
          # Verify lint status without failing the build if minor unfixable warnings remain
          uv run ruff check . --exit-zero
