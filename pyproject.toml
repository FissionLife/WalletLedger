[project]
name = "WalletLedger"
version = "0.1.0"
description = "WalletLedger - Payment API & AI Financial Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "cryptography>=44.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "litellm>=1.104.0",
    "pg8000>=1.31.5",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf2>=3.0.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
