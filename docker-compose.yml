# Local PostgreSQL for WalletLedger, plus (optional) the app itself and a Cloudflare Tunnel.
#   Start:  docker compose up -d
#   Status: docker compose ps        (should show "healthy")
#   Stop:   docker compose down      (data is kept in the walletledger_pgdata volume)
#   Wipe:   docker compose down -v   (deletes all data)
#
# Port 5433 on your machine -> 5432 in the container, so it does not clash with a
# locally installed PostgreSQL on 5432. Matches DATABASE_URL in .env.example.
services:
  db:
    image: postgres:16
    container_name: walletledger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - walletledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app in a container (build from ./Dockerfile). Off unless you ask for it:
  #   docker compose --profile app up -d --build
  # It talks to the db service above, so it always uses Postgres.
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_MODE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8080"

  # A named Cloudflare Tunnel in front of the app (stable https address, dashboard works in Telegram).
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env and PUBLIC_URL set to your tunnel's hostname. See docs/CLOUDFLARE.md.
  #   docker compose --profile app --profile tunnel up -d --build
  # In the tunnel's "Public hostname" settings, point the service at  http://app:8080
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  walletledger_pgdata:
