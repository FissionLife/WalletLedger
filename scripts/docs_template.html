<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · WalletLedger docs</title>
<meta name="description" content="WalletLedger documentation: {{TITLE}}">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ROOT}}favicon.svg" type="image/svg+xml">
<style>
/* Generated by scripts/build_docs.py. Same colour tokens as the landing page (site/styles.css). */
:root{--surface:#fff;--variant:#f4f4f5;--raised:#fff;--outline:#737373;--line:#e4e4e7;--text:#18181b;--text2:#525252;--primary:#f6821f;--on-primary:#18181b;--container:#fff0e0;--on-container:#7a3300;--link:#b34700;--code:#f4f4f5}
:root[data-theme=dark]{--surface:#121214;--variant:#1b1b1e;--raised:#252528;--outline:#8f8f8f;--line:#323236;--text:#ececec;--text2:#b3b3b3;--primary:#f6821f;--container:#2a2a2e;--on-container:#ffb877;--link:#ff9e4a;--code:#1b1b1e}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--surface:#121214;--variant:#1b1b1e;--raised:#252528;--outline:#8f8f8f;--line:#323236;--text:#ececec;--text2:#b3b3b3;--container:#2a2a2e;--on-container:#ffb877;--link:#ff9e4a;--code:#1b1b1e}}
*{box-sizing:border-box}
html{scroll-padding-top:76px}
body{margin:0;background:var(--surface);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;font-size:16px;display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--text);margin-right:auto}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--primary);display:inline-grid;place-items:center;color:#18181b;font-style:normal;font-size:14px}
.top a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--text2);font-weight:500;font-size:15px}
.top a:hover{background:var(--variant)}
.top a[aria-current]{background:var(--container);color:var(--on-container)}
.top{display:flex;gap:2px;flex-wrap:wrap}
.iconbtn{border:1px solid var(--line);background:var(--variant);border-radius:999px;padding:7px 12px;color:inherit;font:inherit;cursor:pointer}
.layout{max-width:1180px;margin:0 auto;padding:20px 16px 80px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){.layout{grid-template-columns:230px minmax(0,1fr)}}
aside nav{position:sticky;top:76px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);margin:0 0 8px}
aside ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media(max-width:899px){aside ul{flex-direction:row;flex-wrap:wrap;gap:6px}}
aside a{display:block;padding:6px 12px;border-radius:10px;text-decoration:none;color:var(--text2);font-size:14.5px}
aside a:hover{background:var(--variant)}
aside a[aria-current]{background:var(--container);color:var(--on-container);font-weight:600}
article{min-width:0;max-width:820px}
article h1{font-size:clamp(26px,4vw,36px);line-height:1.2;margin:.2em 0 .5em}
article h2{font-size:24px;margin:2em 0 .5em;padding-top:.4em;border-top:1px solid var(--line)}
article h3{font-size:19px;margin:1.6em 0 .4em}
article h4{font-size:16px;margin:1.4em 0 .3em}
article p,article li{max-width:75ch}
article blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--primary);background:var(--variant);border-radius:0 12px 12px 0;color:var(--text2)}
article blockquote p{margin:.3em 0}
code{font:.88em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code);padding:.12em .38em;border-radius:6px}
pre{background:var(--code);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:auto;line-height:1.5}
pre code{background:none;padding:0;font-size:13.5px}
pre.mermaid{background:var(--raised);text-align:center;border-radius:16px;padding:16px}
.table-wrap{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{background:var(--variant);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
img{max-width:100%}
.source{margin-top:3em;padding-top:1em;border-top:1px solid var(--line);font-size:14px;color:var(--text2)}
.doc-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:1.5em}
.doc-card{display:block;background:var(--variant);border:1px solid transparent;border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--text)}
.doc-card:hover{border-color:var(--primary)}
.doc-card b{display:block;margin-bottom:2px}
.doc-card span{color:var(--text2);font-size:14px}
</style>
<script>
/* apply the saved theme before first paint (shared with the landing page and the explorer) */
try{var t=localStorage.getItem("wl-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="{{ROOT}}"><i>W</i> WalletLedger</a>
  <nav class="top" aria-label="Site">
    <a href="{{ROOT}}">Home</a>
    <a href="{{ROOT}}explore/">Explore the code</a>
    <a href="{{ROOT}}docs/" aria-current="page">Docs</a>
    <a href="https://github.com/FissionLife/WalletLedger">GitHub</a>
  </nav>
  <button class="iconbtn" id="theme" type="button" aria-label="Switch light or dark">◐</button>
</div></header>
<div class="layout">
  <aside><nav aria-label="Docs"><h2>Docs</h2><ul>
{{NAV}}
  </ul></nav></aside>
  <article>
{{BODY}}
    <p class="source"><a href="{{SOURCE}}">Edit or view this page on GitHub ↗</a> · generated from the repository's Markdown, so it never goes stale.</p>
  </article>
</div>
<script>
document.getElementById("theme").addEventListener("click", function () {
  var root = document.documentElement;
  var dark = (root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("wl-theme", root.dataset.theme); } catch (e) {}
  if ({{HAS_DIAGRAM}}) location.reload(); /* diagrams are drawn once, so redraw them in the new theme */
});
</script>
{{SCRIPT}}
</body>
</html>
